name: Tag verified 1.1.14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-verified-1.1.14.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be7a3eeb7fef9d96a70d36ba5d46410c336592ac
          fetch-depth: 0
      - name: Tag the published and user-tested source
        run: |
          if git show-ref --verify --quiet refs/tags/v1.1.14; then
            test "$(git rev-parse 'refs/tags/v1.1.14^{commit}')" = be7a3eeb7fef9d96a70d36ba5d46410c336592ac
          else
            git tag v1.1.14 be7a3eeb7fef9d96a70d36ba5d46410c336592ac
            git push origin refs/tags/v1.1.14:refs/tags/v1.1.14
          fi
