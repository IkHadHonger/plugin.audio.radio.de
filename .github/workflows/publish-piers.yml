name: Publish Piers
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish-radio-de-piers
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check publication credential
        env:
          REPO_PAT: ${{ secrets.REPO_SILVO_PAT }}
        run: test -n "$REPO_PAT"
      - name: Checkout Piers distribution branch
        uses: actions/checkout@v4
        with:
          repository: IkHadHonger/repository.silvo
          ref: cube-custom
          path: repo-silvo
          token: ${{ secrets.REPO_SILVO_PAT }}
      - name: Verify current main
        id: current
        run: |
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$remote_sha"
          if [ "$(git rev-parse HEAD)" = "$remote_sha" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "Superseded source commit; a newer main build owns publication."
          fi
      - name: Allocate addon version
        if: steps.current.outputs.latest == 'true'
        id: version
        run: python tools/prepare_release.py
      - name: Validate versioned package
        if: steps.version.outputs.publish == 'true'
        run: python tools/build.py
      - name: Save automatic version in source
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- addon.xml
          git commit -m 'Bump addon version for automatic Piers release'
          git push origin HEAD:main
      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate, build and stage Piers package
        if: steps.version.outputs.publish == 'true'
        run: python tools/stage_piers.py repo-silvo
      - name: Commit scoped Piers changes
        if: steps.version.outputs.publish == 'true'
        working-directory: repo-silvo
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- piers/plugin.audio.radiode piers/addons.xml piers/addons.xml.md5 piers/index.html
          if git diff --cached --quiet; then
            echo 'Package already published; no changes.'
          else
            git commit -m 'Publish Radio.de for Piers' -m "Source: IkHadHonger/plugin.audio.radio.de@$SOURCE_SHA"
            git push origin HEAD:cube-custom
          fi
